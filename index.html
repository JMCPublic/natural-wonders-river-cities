<style>

 background:radial-gradient(circle at 4px 4px,#6e3517 1px,transparent 1.6px),radial-gradient(circle at calc(100% - 4px) 4px,#6e3517 1px,transparent 1.6px),radial-gradient(circle at 4px calc(100% - 4px),#6e3517 1px,transparent 1.6px),radial-gradient(circle at calc(100% - 4px) calc(100% - 4px),#6e3517 1px,transparent 1.6px),linear-gradient(135deg,#eab48a 0%,#c47746 30%,#97502a 58%,#d08f60 82%,#a85d33 100%);
 border:1px solid #7a3c1c;box-shadow:inset 0 1px 0 rgba(255,236,215,.6),inset 0 -1px 0 rgba(60,25,8,.35),0 1px 2px rgba(60,30,10,.25);text-shadow:0 -1px 0 rgba(70,30,10,.55)}

<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
const VERSION='v3';
/* ---------- timer (shared) ---------- */
const TM={on:true,left:0,secs:15,copper:5,t0:0,iv:null,key:null,onUp:null,
  start(key,secs,copper,onUp){if(!this.on){this.hide();return}if(this.key===key&&this.iv)return;this.stop();this.key=key;this.secs=secs;this.copper=copper;this.onUp=onUp;this.t0=performance.now();this.build();this.draw(secs);
    this.iv=setInterval(()=>{const l=this.secs-(performance.now()-this.t0)/1000;this.draw(l);if(l<=0){this.stop();const f=this.onUp;this.onUp=null;if(f)f()}},100)},
  elapsed(){return Math.min(this.secs,(performance.now()-this.t0)/1000)},
  stop(){if(this.iv){clearInterval(this.iv);this.iv=null}},
  hide(){this.stop();this.key=null;const b=document.getElementById('tbar');if(b)b.remove();document.body.classList.remove('timed')},
  build(){let b=document.getElementById('tbar');const phone=document.documentElement.classList.contains('phone');const blocks=Math.round(this.secs/5);const per=(phone&&this.secs>15)?1:5;
    const sig=blocks+'x'+per;if(b&&b.dataset.sig===sig)return;if(b)b.remove();b=document.createElement('div');b.id='tbar';b.className='tbar';b.dataset.sig=sig;b.setAttribute('role','timer');b.setAttribute('aria-label','Time left for this question');
    b.innerHTML=`<div class="in"><div class="segs">${Array.from({length:blocks},()=>`<div class="grp">${'<i class="sg"></i>'.repeat(per)}</div>`).join('')}</div><div class="tnum"></div></div>`;document.body.appendChild(b);document.body.classList.add('timed')},
  draw(l){const b=document.getElementById('tbar');if(!b)return;const segs=b.querySelectorAll('.sg');const sps=this.secs/segs.length;const n=Math.max(0,Math.ceil(l/sps-1e-9));const warn=l<=this.copper;
    segs.forEach((s,i)=>{s.classList.toggle('off',i>=n);s.classList.toggle('cu',warn&&i<n)});const t=b.querySelector('.tnum');t.classList.toggle('cu',warn);t.innerHTML=`${Math.max(0,Math.ceil(l))}<small>s</small>`},
  fmt(s){s=Math.round(s);return s<60?`${s} second${s===1?'':'s'}`:`${Math.floor(s/60)} min ${s%60} s`},
  summary(right,total,secs){return this.on?`<div class="tsum"><b>${right}/${total} in ${this.fmt(secs)}</b> · ${this.left?`left the page ${this.left} time${this.left===1?'':'s'}`:'stayed on the page throughout'}</div>`:''},
  menuRow(note){return `<div class="label">Timer</div><div class="opts"><button class="opt ${this.on?'on':''}" onclick="setTimerOpt(true)">⏱ Timed<small>${note}</small></button><button class="opt ${this.on?'':'on'}" onclick="setTimerOpt(false)">No timer<small>Take your time</small></button></div>`}};
try{const v=localStorage.getItem('timer_on');if(v!==null)TM.on=v==='1'}catch(e){}
window.setTimerOpt=v=>{TM.on=v;try{localStorage.setItem('timer_on',v?'1':'0')}catch(e){}render()};

  for(const l of runs.slice(0,3)){let len=0;for(let i=1;i<l.length;i++)len+=Math.hypot(l[i][0]-l[i-1][0],l[i][1]-l[i-1][1]);const short0=len<half*2.8;
   for(const short of short0?[true]:[false,true])for(const f of [.5,.35,.65,.25,.75,.15,.85,.1,.9])for(const side of [1,-1]){const i=Math.max(1,Math.min(l.length-2,Math.floor(l.length*f)));const a=l[Math.max(0,i-3)],b=l[Math.min(l.length-1,i+3)],p=l[i];
    let ang=short?0:Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;if(ang>90)ang-=180;if(ang<-90)ang+=180;const ra=ang*Math.PI/180;const ux=Math.cos(ra),uy=Math.sin(ra);
    const off=(short?16:13)*K*side;const x=p[0]-uy*off,y=p[1]+ux*off;if(x-Math.abs(ux)*half<4||x+Math.abs(ux)*half>W-4||y-Math.abs(uy)*half<10||y+Math.abs(uy)*half>W-10)continue;
    let clash=0;for(let t=-half;t<=half;t+=6){const sx=x+ux*t,sy=y+uy*t;for(const q of avoid)if(Math.hypot(q[0]-sx,q[1]-sy)<19*K)clash++}
    if(!best||clash<best.clash)best={x,y,ang,clash};if(clash===0)break}
   if(best&&best.clash===0)break}
  if(!best)return '';return `<text class="rl" font-size="${16*K}" stroke-width="${4.5*K}" x="${best.x.toFixed(1)}" y="${best.y.toFixed(1)}" transform="rotate(${best.ang.toFixed(0)} ${best.x.toFixed(1)} ${best.y.toFixed(1)})" text-anchor="middle" dominant-baseline="central">${esc(r.n)}</text>`}
function baseMap(c,r,K,extra){uid++;return `<svg viewBox="0 0 ${W} ${W}" class="map" role="img" aria-label="Map of ${esc(c.name)} showing the ${esc(r.n)}"><defs><clipPath id="clip${uid}"><path d="${c.d}"/></clipPath><linearGradient id="cu${uid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eab48a"/><stop offset=".35" stop-color="#c47746"/><stop offset=".65" stop-color="#97502a"/><stop offset="1" stop-color="#d08f60"/></linearGradient></defs>
  <path d="${c.d}" fill="#16130f"/><path d="${lineD(r)}" fill="none" stroke="#fff" stroke-width="${3.2*Math.max(1,K*.85)}" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#clip${uid})"/>${extra}</svg>`}
function questionMap(R,K){const c=BYC[R.c],r=c.rivers[R.ri];const pts=R.targets.map(i=>c.cities[i].xy);let marks='';const placed=[];
  R.targets.forEach((ci,j)=>{const [x,y]=c.cities[ci].xy;const z=24*K;let best=null;
    for(const rad of [26,38,52]){for(const a of [0,180,-45,-135,45,135,-90,90]){const cx=x+Math.cos(a*Math.PI/180)*rad*K,cy=y+Math.sin(a*Math.PI/180)*rad*K;
      if(cx<z||cx>W-z||cy<z||cy>W-z)continue;if(placed.concat(pts.filter((_,q)=>q!==j)).some(p=>Math.hypot(p[0]-cx,p[1]-cy)<z*1.15))continue;best=[cx,cy];break}if(best)break}
    if(!best)best=[x+26*K,y];placed.push(best);
    marks+=`<line x1="${x}" y1="${y}" x2="${best[0].toFixed(1)}" y2="${best[1].toFixed(1)}" stroke="#b8663a" stroke-width="${1.6*K}"/><circle cx="${x}" cy="${y}" r="${5.5*K}" fill="#fff" stroke="#b8663a" stroke-width="${2.5*K}"/><g transform="translate(${best[0].toFixed(1)},${best[1].toFixed(1)})"><rect x="${-z/2}" y="${-z/2}" width="${z}" height="${z}" rx="${z*.22}" fill="url(#cu${uid+1})" stroke="#7a3c1c"/><text class="rlp" font-size="${15*K}" text-anchor="middle" dominant-baseline="central">${LET[j]}</text></g>`});
  return baseMap(c,r,K,riverLabel(r,K,pts.concat(placed))+marks)}
function resultsMap(R){const c=BYC[R.c],r=c.rivers[R.ri];const boxes=[];let dots='',labels='';
  const wrong=new Set(R.slots.filter((n,j)=>n!=null&&n!==R.targets[j]));
  const items=R.ten.map((ci,ix)=>({ci,num:ix+1,city:c.cities[ci],t:R.targets.indexOf(ci),w:wrong.has(ci)})).sort((a,b)=>(b.t>=0)-(a.t>=0)||b.w-a.w);
  items.forEach(o=>{const [x,y]=o.city.xy;const col=o.t>=0?'#b8663a':o.w?'#e04a3a':'#cfc6b6';boxes.push({x0:x-6,x1:x+6,y0:y-6,y1:y+6});
    dots+=`<circle cx="${x}" cy="${y}" r="${o.t>=0?6:4.5}" fill="${o.t>=0?'#fff':col}" stroke="${col}" stroke-width="${o.t>=0?3:1.5}"/>`});
  items.forEach(o=>{const [x,y]=o.city.xy;const txt=`${o.num} ${o.city.n}${o.t>=0?' ('+LET[o.t]+')':''}`;const w=txt.length*6.6+4,h=15;let best=null;
    for(const [dx,dy,anc] of [[9,4,'start'],[-9,4,'end'],[0,-10,'middle'],[0,17,'middle'],[9,-8,'start'],[-9,-8,'end'],[9,16,'start'],[-9,16,'end']]){
      const x0=anc==='start'?x+dx:anc==='end'?x+dx-w:x-w/2;const b={x0,x1:x0+w,y0:y+dy-11,y1:y+dy-11+h};if(b.x0<2||b.x1>W-2||b.y0<2||b.y1>W-2)continue;
      if(!boxes.some(q=>!(b.x1<q.x0||b.x0>q.x1||b.y1<q.y0||b.y0>q.y1))){best={x:x+dx,y:y+dy,anc,b};break}}
    if(!best){const b={x0:x+9,x1:x+9+w,y0:y-7,y1:y+8};best={x:x+9,y:y+4,anc:'start',b}}boxes.push(best.b);
    labels+=`<text class="cl ${o.t>=0?'t':o.w?'w':''}" x="${best.x.toFixed(1)}" y="${best.y.toFixed(1)}" text-anchor="${best.anc}">${esc(txt)}</text>`});
  return baseMap(c,r,1,riverLabel(r,1,items.filter(o=>o.t>=0).map(o=>o.city.xy))+dots+labels).replace('class="map"','class="map rmap"')}

/* ---------- layout ---------- */
const LAYOUTS={auto:'Auto',phone:'Phone',tablet:'Tablet',desktop:'Desktop'};
function autoLayout(){const w=innerWidth,coarse=matchMedia&&matchMedia('(pointer:coarse)').matches;if(w<600)return 'phone';if(coarse)return 'tablet';return 'desktop'}
function curLayout(){return S.layout==='auto'?autoLayout():S.layout}
function applyLayout(){const l=curLayout();['phone','tablet','desktop'].forEach(c=>document.documentElement.classList.toggle(c,c===l));return l}
let lastLay=null;addEventListener('resize',()=>{const l=applyLayout();if(l!==lastLay){lastLay=l;if(S.screen!=='menu')render(true)}});
window.setLayout=l=>{S.layout=l;save();render()};
function render(keep){lastLay=applyLayout();document.getElementById('app').innerHTML=S.screen==='menu'?menuHTML():S.screen==='play'?playHTML():resultsHTML();if(!keep)scrollTo(0,0);syncTimer()}
function syncTimer(){if(S.screen!=='play'){TM.hide();return}const R=S.game[S.cur];if(R.done)return;const secs=15*R.targets.length;TM.start(GSER+':'+S.cur,secs,10,()=>{R.timedOut=true;R.secs=secs;R.done=true;advance()})}
function advance(){S.cur++;if(S.cur>=S.game.length)S.screen='results';render()}
function menuHTML(){const nR=riversFor(S.where,+S.k).length;const nAll=COUNTRIES.reduce((s,c)=>s+c.rivers.length,0);
  return `<div class="menuhead"><div><div class="nwser"><b>Natural Wonders</b> · Game 7 of 10 · <a href="https://jmcpublic.github.io/">All games</a></div><h1>River Cities</h1></div><p class="sub">A river and its country. Cities A and B sit on the river. Which ones are they? Pick from ten numbered cities.</p></div>
  <div class="panel menu"><div><div class="label">Where</div><div class="opts">${Object.entries(WHERE).map(([k,v])=>`<button class="opt ${S.where===k?'on':''}" onclick="setOpt('where','${k}')">${v.t}<small>${v.s?v.s+' · ':''}${riversFor(k,2).length} rivers</small></button>`).join('')}</div>
  <div class="label">Cities to find each round</div><div class="opts">${Object.entries(KN).map(([k,v])=>{const na=!riversFor(S.where,+k).length;return `<button class="opt ${String(S.k)===k?'on':''} ${na?'na':''}" ${na?'disabled':''} onclick="setOpt('k',${k})">${v.t}<small>${na?'Not enough here':v.s}</small></button>`}).join('')}</div></div>
  <div>${TM.menuRow('15 s per city to find')}<div class="label">Number of rounds</div><div class="opts">${ROUNDS.map(n=>`<button class="opt ${S.rounds===n?'on':''}" onclick="setOpt('rounds',${n})">${n} rounds</button>`).join('')}</div>
  <div class="row" style="margin-top:18px"><button class="btn" onclick="startGame()">Start — ${S.rounds} rounds</button></div>
  <p class="gcap" style="margin-top:10px">${nR} river${nR===1?'':'s'} to play with here. A river can come up again in a long game, with different cities.</p></div></div>
  <p class="foot">Layout <span class="lay">${Object.entries(LAYOUTS).map(([k,v])=>`<button class="${S.layout===k?'on':''}" onclick="setLayout('${k}')">${v}${k==='auto'&&S.layout==='auto'?' ('+LAYOUTS[autoLayout()]+')':''}</button>`).join('')}</span><br>${nAll} rivers in ${COUNTRIES.length} countries · Natural Wonders: River Cities ${VERSION} · <button class="srclink" onclick="openSources()">Sources</button></p>`}
window.setOpt=(k,v)=>{S[k]=k==='where'?v:+v;if(!riversFor(S.where,+S.k).length)S.k=2;save();render()};
window.startGame=()=>{const g=makeGame();if(!g){toast('Not enough rivers for that choice. Try 2 cities or another region.');return}GSER++;TM.left=0;S.game=g;S.cur=0;S.screen='play';render()};
function playHTML(){const R=S.game[S.cur],c=BYC[R.c],r=c.rivers[R.ri],phone=curLayout()==='phone',k=R.targets.length;const full=R.slots.every(x=>x!=null);
  const prog=S.game.map((_,i)=>`<i class="${i<S.cur?'done':i===S.cur?'now':''}"></i>`).join('');
  const lets=LET.slice(0,k).split('');const letStr=lets.length===2?'A and B':'A, B and C';
  const slots=R.slots.map((ci,j)=>`<button class="cslot ${ci!=null?'full':''}" onclick="unslot(${j})"><span class="plate">${LET[j]}</span>${ci!=null?`<span class="num">${R.ten.indexOf(ci)+1}</span><b>${esc(c.cities[ci].n)}</b><span class="x">✕</span>`:'<span class="empty">tap a city below</span>'}</button>`).join('');
  const list=R.ten.map((ci,ix)=>`<button class="ct ${R.slots.includes(ci)?'used':''}" onclick="place(${ix})"><span class="num">${ix+1}</span><span>${esc(c.cities[ci].n)}</span></button>`).join('');
  return `<div class="play"><div class="top"><h1>River Cities</h1><div class="row">${S.cur>0&&!TM.on?'<button class="link" onclick="back()">← Previous</button>':''}<button class="link" onclick="quit()">Quit</button></div></div>
  <div class="prog">${prog}</div>
  <div class="q">Which cities sit on the <em>${esc(r.n)}</em> at ${letStr}?<span>Round ${S.cur+1} of ${S.game.length} · ${esc(c.name)}</span></div>
  <div class="board"><div class="mapcard"><div class="cname">${esc(c.name)}</div>${questionMap(R,phone?1.35:1)}</div>
  <div class="rank"><div class="label">Which cities are ${letStr}?</div><div class="cslots">${slots}</div><div class="label">The ten cities</div><div class="clist">${list}</div>
  <button class="btn" onclick="lock()" ${full?'':'disabled'}>${full?'Lock in answer':'Fill every box to lock in'}</button>
  <div class="kbd">Keys 1–9 and 0 (for 10) choose · Backspace removes · Enter locks in</div></div></div></div>`}
window.place=ix=>{const R=S.game[S.cur];const ci=R.ten[ix];if(R.slots.includes(ci))return;const j=R.slots.indexOf(null);if(j<0)return;R.slots[j]=ci;render(true)};
window.unslot=j=>{const R=S.game[S.cur];if(R.slots[j]!=null){R.slots[j]=null;render(true)}};
window.lock=()=>{const R=S.game[S.cur];if(!R.slots.every(x=>x!=null)||R.done)return;if(TM.on){R.done=true;R.secs=TM.elapsed();TM.stop()}advance()};
window.back=()=>{if(S.cur>0){S.cur--;render()}};window.quit=()=>{TM.hide();S.screen='menu';render()};
addEventListener('keydown',e=>{if(S.screen!=='play'||document.querySelector('.srcov.open'))return;const R=S.game[S.cur];
  if(/^[0-9]$/.test(e.key)){place(e.key==='0'?9:+e.key-1)}
  else if(e.key==='Backspace'){e.preventDefault();for(let j=R.slots.length-1;j>=0;j--)if(R.slots[j]!=null){R.slots[j]=null;render(true);break}}
  else if(e.key==='Enter'){e.preventDefault();lock()}});

/* ---------- results ---------- */
function verdict(p){return p===1?'Perfect. You know your rivers.':p>=.8?'Excellent. A real river pilot.':p>=.6?'Solid effort. A few surprises in there.':p>=.4?'Some of those cities fooled you.':'Plenty to explore along the riverbanks!'}
function onWhat(c,ci){const on=c.cities[ci].on;return on.length?`on the ${on.map(esc).join(' and the ')}`:null}
function resultsHTML(){let right=0,total=0;const cards=[];
  S.game.forEach((R,ri)=>{const c=BYC[R.c],r=c.rivers[R.ri];let rr=0;const facts=[];
    const rows=R.targets.map((t,j)=>{const mine=R.slots[j];const ok=mine===t;total++;if(ok){right++;rr++}
      if(!ok&&mine!=null){const w=onWhat(c,mine);const onRiver=c.cities[mine].on.includes(r.n);
        if(onRiver)facts.push(R.targets.includes(mine)?`${esc(c.cities[mine].n)} is on the ${esc(r.n)} too, but it's ${LET[R.targets.indexOf(mine)]}, not ${LET[j]}.`:`${esc(c.cities[mine].n)} is on the ${esc(r.n)} too, but it isn't one of the marked cities.`);
        else facts.push(`${esc(c.cities[mine].n)} isn't on the ${esc(r.n)}${w?`. It's ${w}`:''}.`)}
      return `<div class="rr2"><span class="plate">${LET[j]}</span><div><b>${R.ten.indexOf(t)+1} · ${esc(c.cities[t].n)}</b>${ok?'':mine==null?'<div class="sub2">⏱ Not chosen in time</div>':`<div class="sub2">You said ${R.ten.indexOf(mine)+1} · ${esc(c.cities[mine].n)}</div>`}</div>${ok?'<span class="st ok">✓ Correct</span>':'<span class="st no">✗ Not quite</span>'}</div>`}).join('');
    const also=r.cities.filter(i=>!R.targets.includes(i)).map(i=>c.cities[i].n);
    if(also.length)facts.push(`Also on the ${esc(r.n)} in ${esc(c.name)}: ${also.map(esc).join(', ')}.`);
    const wrongs=new Set(R.slots.filter((n,j)=>n!=null&&n!==R.targets[j]));
    cards.push(`<div class="rcard"><div class="rhd"><div><div class="label" style="margin:0">Round ${ri+1} · ${esc(c.name)}</div><h3>Cities on the ${esc(r.n)}</h3></div><div class="rs">${rr}/${R.targets.length}</div></div>${TM.on&&R.secs!=null?`<div class="tstat">${R.timedOut?'Time ran out':'Answered in '+R.secs.toFixed(1)+' s'}</div>`:''}
     <div class="rgrid"><div>${resultsMap(R)}<div class="legend"><span><i class="lg t"></i>On the ${esc(r.n)} (${LET.slice(0,R.targets.length).split('').join(', ')})</span>${wrongs.size?'<span><i class="lg w"></i>Your wrong pick</span>':''}<span><i class="lg o"></i>The other cities</span></div></div>
     <div>${rows}<div class="fact">${facts.map(f=>`<p>💡 ${f}</p>`).join('')}</div><div class="srcline">Source: <a href="${wikiURL(r.wiki)}" target="_blank" rel="noopener">Wikipedia: ${esc(decodeURIComponent(r.wiki).replace(/_/g,' '))}</a>. Map and city positions from <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>.</div></div></div></div>`)});
  return `<h1>Results</h1><div class="panel"><div class="score"><div class="big">${right}/${total}</div><div><h2>${verdict(right/total)}</h2>${TM.summary(right,total,S.game.reduce((s,r)=>s+(r.secs||0),0))}<div style="color:var(--muted);font-size:14px">River Cities · ${esc(WHERE[S.where].t.replace(/^\S+ (?=[A-Z])/,''))} · ${S.game[0].targets.length} cities a round · ${S.game.length} rounds</div></div></div>
  <div class="row" style="margin-top:16px"><button class="btn" onclick="startGame()">Play again</button><button class="btn ghost" onclick="quit()">Change settings</button><button class="btn ghost" onclick="share(${right},${total})">Share score</button><button class="btn ghost" onclick="openSources()">Sources</button><a class="btn ghost" href="https://jmcpublic.github.io/">More games</a></div></div>
  <div class="label" style="margin-top:24px">Round by round</div>${cards.join('')}<p class="foot">Which river each city stands on comes from the Wikipedia article named under each round. <button class="srclink" onclick="openSources()">See all sources</button></p>`}
window.share=async(r,n)=>{const t=`Natural Wonders: River Cities. I scored ${r}/${n}. Can you beat me?`;const u=location.href.startsWith('http')?location.href:'';
  try{if(navigator.share){await navigator.share({text:t,url:u||undefined});return}}catch(e){return}
  try{await navigator.clipboard.writeText(t+(u?' '+u:''));toast('Score copied. Paste it to a friend.')}catch(e){toast(t)}};
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3800)}
function openSources(){let ov=document.getElementById('srcov');if(!ov){ov=document.createElement('div');ov.id='srcov';ov.className='srcov';ov.addEventListener('click',e=>{if(e.target===ov)closeSources()});document.body.appendChild(ov)}
 ov.innerHTML=`<div class="srcbox" role="dialog" aria-label="Sources"><button class="srcx" onclick="closeSources()">Close</button>${sourcesBody()}</div>`;ov.classList.add('open');ov.scrollTop=0}
function closeSources(){const ov=document.getElementById('srcov');if(ov)ov.classList.remove('open')}
addEventListener('keydown',e=>{if(e.key==='Escape')closeSources()});
function sourcesBody(){
  const rows=COUNTRIES.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>c.rivers.map(r=>`<tr><td>${esc(c.name)}</td><td><a href="${wikiURL(r.wiki)}" target="_blank" rel="noopener">${esc(r.n)}</a></td><td>${r.cities.map(i=>esc(c.cities[i].n)).join(', ')}</td></tr>`).join('')).join('');
  const facts=COUNTRIES.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>{const fr=c.wiki.filter(w=>!c.rivers.some(r=>r.n===w.n));return fr.length?`<tr><td>${esc(c.name)}</td><td>${fr.map(w=>`<a href="${wikiURL(w.wiki)}" target="_blank" rel="noopener">${esc(w.n)}</a>`).join(', ')}</td></tr>`:''}).join('');
  return `<h2>Sources</h2>
  <p class="gf">Which river each city stands on was taken in good faith in October 2026 from the English Wikipedia article for that river, linked below. Maps, river courses and city positions come from Natural Earth. If you think a city is wrong, the source named next to it is where it came from.</p>
  <h3>How the game stays fair</h3><ul><li>The marked cities (A, B, C) are each named in the river's Wikipedia article, and each one also lies within 12 km of the river on the Natural Earth map.</li>
  <li>The wrong answers are cities that are not listed on that river and are more than 25 km from it on the map. Cities on its estuary or a side branch (such as Southend-on-Sea on the Thames Estuary) are never used as wrong answers.</li>
  <li>Marked cities are always at least 40 km apart, and A is upstream of B (and B of C).</li></ul>
  <h3>Rivers used for questions</h3><details open><summary>${COUNTRIES.reduce((s,c)=>s+c.rivers.length,0)} rivers · the cities the game marks on each</summary><table><tr><td><b>Country</b></td><td><b>River</b></td><td><b>Cities</b></td></tr>${rows}</table></details>
  <h3>Other rivers mentioned in the results</h3><details><summary>When you pick a city on a different river, the results say which one</summary><table>${facts}</table></details>
  <h3>Maps</h3><ul><li><a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a> 1:10m countries, rivers and populated places (public domain). Outlines are simplified, and only a country's mainland is drawn.</li></ul>
  <p style="font-size:12px;color:#6f685d;margin-top:14px">River Cities ${VERSION}</p>`}
render();
</script>
</body>
